name: Sprawdz oferty iPhone

on:
  schedule:
    # co 5 minut - to jest twardo wymuszone minimum GitHub Actions.
    # "* * * * *" (co 1 min) NIE dziala mimo poprawnej skladni - GitHub
    # i tak egzekwuje odstep min. 5 minut, a przy duzym obciazeniu
    # potrafi to jeszcze opoznic o kolejne kilka-kilkanascie minut.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # pozwala odpalic recznie z zakladki Actions

permissions:
  contents: write  # potrzebne, zeby workflow mogl zapisac seen_ids.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zaleznosci
        run: pip install -r requirements.txt

      - name: Cache przegladarki Playwright (Vinted potrzebuje prawdziwej przegladarki)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Zainstaluj przegladarke Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Sprawdz nowe oferty i wyslij na Discorda
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_offers.py

      - name: Zapisz stan (seen_ids.json)
        run: |
          git config user.name "offer-bot"
          git config user.email "offer-bot@users.noreply.github.com"
          git add seen_ids.json
          git diff --cached --quiet || git commit -m "Aktualizacja listy widzianych ofert"
          git push
