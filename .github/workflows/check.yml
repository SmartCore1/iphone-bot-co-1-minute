name: Sprawdz oferty iPhone

on:
  schedule:
    # Bot działa tylko 9:00–22:00 czasu polskiego (pilnuje tego krok „Sprawdzaj co 10 minut”).
    # Jedno uruchomienie samo sprawdza oferty co 10 minut aż do 22:00 (najdłużej ~5 h 40 min –
    # limit GitHuba to 6 h), a na koniec samo odpala następne.
    # Harmonogram GitHuba potrafi pomijać całe godziny (25.10 nie odpalił ani razu), więc
    # próbuje co 15 minut – to tylko zapas na start rano i gdyby łańcuch się przerwał.
    # Godziny są w UTC: 7–20 UTC obejmuje 8–22 w Polsce i zimą, i latem; resztę odcina skrypt.
    - cron: "*/15 7-20 * * *"
  workflow_dispatch: {}  # pozwala odpalic recznie z zakladki Actions

permissions:
  contents: write  # potrzebne, zeby workflow mogl zapisac seen_ids.json
  actions: write   # odpalenie kolejnego uruchomienia po limicie 6 h

# Jedno uruchomienie naraz - dwa rownolegle nadpisywalyby sobie seen_ids.json.
# Kolejne czeka w kolejce (GitHub trzyma jedno oczekujace) i rusza po zakonczeniu biezacego.
concurrency:
  group: sprawdz-oferty
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # limit GitHuba to 6 h na zadanie
    env:
      PYTHONUNBUFFERED: "1"  # log z każdego sprawdzenia widać na bieżąco
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      # Opcjonalnie: zakladka "Okazje" w panelu SmartCore (token uslugi Cloudflare Access)
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zaleznosci
        run: pip install -r requirements.txt

      - name: Cache przegladarki Playwright (Vinted potrzebuje prawdziwej przegladarki)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Zainstaluj przegladarke Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Sprawdzaj co 10 minut
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "offer-bot"
          git config user.email "offer-bot@users.noreply.github.com"

          # Zapis seen_ids.json po kazdym sprawdzeniu. Jesli w miedzyczasie ktos wypchnal zmiany
          # (np. nowy kod), dociagamy je – przy konflikcie w seen_ids.json wygrywa wersja z bota.
          zapisz() {
            git add seen_ids.json
            git diff --cached --quiet && return 0
            git commit -q -m "Aktualizacja listy widzianych ofert"
            for i in 1 2 3; do
              git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q && return 0
              sleep 5
            done
            echo "::warning::Nie udalo sie zapisac seen_ids.json - sprobuje przy nastepnym sprawdzeniu"
          }

          # Godziny pracy bota w Polsce (Europe/Warsaw sama uwzględnia czas letni i zimowy).
          OD=9
          DO=22
          godzina() { echo $((10#$(TZ=Europe/Warsaw date '+%H'))); }

          # Uruchomienie z 8:xx czeka do 9:00; poza godzinami pracy od razu się kończy.
          if [ "$(godzina)" -eq $((OD - 1)) ]; then
            DO_STARTU=$(( (60 - 10#$(TZ=Europe/Warsaw date '+%M')) * 60 ))
            echo "Czekam do ${OD}:00 ($((DO_STARTU / 60)) min)"
            sleep $DO_STARTU
          fi
          if [ "$(godzina)" -lt $OD ] || [ "$(godzina)" -ge $DO ]; then
            echo "Poza godzinami pracy bota (${OD}:00-${DO}:00 w Polsce) - koniec."
            exit 0
          fi

          KONIEC=$((SECONDS + 340 * 60))   # ~5 h 40 min, zostaje zapas do limitu 6 h
          while [ $SECONDS -lt $KONIEC ] && [ "$(godzina)" -lt $DO ]; do
            START=$SECONDS
            echo "::group::Sprawdzenie $(date -u '+%H:%M') UTC"
            timeout 280 python check_offers.py || echo "::warning::To sprawdzenie sie nie udalo - kolejne za chwile"
            zapisz
            echo "::endgroup::"
            RESZTA=$((600 - (SECONDS - START)))   # 600 s = co 10 minut
            if [ $RESZTA -gt 0 ]; then sleep $RESZTA; fi
          done

          # Skończył się limit czasu, a jest jeszcze przed 22:00 – od razu odpalamy następne
          # uruchomienie, zamiast czekać na harmonogram GitHuba.
          if [ "$(godzina)" -lt $DO ]; then
            echo "Limit czasu jednego uruchomienia - odpalam nastepne."
            gh workflow run check.yml --ref "${GITHUB_REF_NAME}" || echo "::warning::Nie udalo sie odpalic nastepnego - zrobi to harmonogram"
          fi
