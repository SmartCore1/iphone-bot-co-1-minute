name: Sprawdz oferty iPhone

on:
  schedule:
    # Harmonogram GitHuba potrafi spóźniać się o godziny, dlatego jedno uruchomienie samo
    # sprawdza oferty co 5 minut przez ~5 h 40 min (niżej, krok „Sprawdzaj co 5 minut”).
    # Cron co godzinę tylko pilnuje, żeby w kolejce zawsze czekało następne uruchomienie –
    # startuje od razu po zakończeniu poprzedniego, więc sprawdzanie idzie bez przerw.
    - cron: "7 * * * *"
  workflow_dispatch: {}  # pozwala odpalic recznie z zakladki Actions

permissions:
  contents: write  # potrzebne, zeby workflow mogl zapisac seen_ids.json

# Jedno uruchomienie naraz - dwa rownolegle nadpisywalyby sobie seen_ids.json.
# Kolejne czeka w kolejce (GitHub trzyma jedno oczekujace) i rusza po zakonczeniu biezacego.
concurrency:
  group: sprawdz-oferty
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # limit GitHuba to 6 h na zadanie
    env:
      PYTHONUNBUFFERED: "1"  # log z każdego sprawdzenia widać na bieżąco
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      # Opcjonalnie: zakladka "Okazje" w panelu SmartCore (token uslugi Cloudflare Access)
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zaleznosci
        run: pip install -r requirements.txt

      - name: Cache przegladarki Playwright (Vinted potrzebuje prawdziwej przegladarki)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Zainstaluj przegladarke Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Sprawdzaj co 5 minut
        run: |
          git config user.name "offer-bot"
          git config user.email "offer-bot@users.noreply.github.com"

          # Zapis seen_ids.json po kazdym sprawdzeniu. Jesli w miedzyczasie ktos wypchnal zmiany
          # (np. nowy kod), dociagamy je – przy konflikcie w seen_ids.json wygrywa wersja z bota.
          zapisz() {
            git add seen_ids.json
            git diff --cached --quiet && return 0
            git commit -q -m "Aktualizacja listy widzianych ofert"
            for i in 1 2 3; do
              git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q && return 0
              sleep 5
            done
            echo "::warning::Nie udalo sie zapisac seen_ids.json - sprobuje przy nastepnym sprawdzeniu"
          }

          KONIEC=$((SECONDS + 340 * 60))   # ~5 h 40 min, zostaje zapas do limitu 6 h
          while [ $SECONDS -lt $KONIEC ]; do
            START=$SECONDS
            echo "::group::Sprawdzenie $(date -u '+%H:%M') UTC"
            timeout 280 python check_offers.py || echo "::warning::To sprawdzenie sie nie udalo - kolejne za chwile"
            zapisz
            echo "::endgroup::"
            RESZTA=$((300 - (SECONDS - START)))
            if [ $RESZTA -gt 0 ]; then sleep $RESZTA; fi
          done
